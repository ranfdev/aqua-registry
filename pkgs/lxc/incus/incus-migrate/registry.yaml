# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: lxc
    repo_name: incus
    name: lxc/incus/incus-migrate
    description: Tool for migrating existing systems into Incus
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.1.0")
        asset: "{{.OS}}.incus-migrate"
        format: raw
        supported_envs:
          - linux/amd64
      - version_constraint: semver("<= 6.22.0")
        asset: bin.{{.OS}}.incus-migrate.{{.Arch}}
        format: raw
        replacements:
          amd64: x86_64
          arm64: aarch64
        supported_envs:
          - linux
      - version_constraint: "true"
        asset: bin.{{.OS}}.incus-migrate.{{.Arch}}
        format: raw
        replacements:
          amd64: x86_64
          arm64: aarch64
        supported_envs:
          - linux
        github_artifact_attestations:
          signer_workflow: lxc/incus/\.github/workflows/release\.yml
